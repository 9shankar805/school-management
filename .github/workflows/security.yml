name: Security Audit

# ──────────────────────────────────────────────────────────────
# Runs weekly and on every push to main/master to catch known
# CVEs in Composer and npm dependencies early.
# ──────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday at 08:00 UTC
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  composer-audit:
    name: Composer Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Composer security audit
        run: composer audit --no-interaction

  npm-audit:
    name: npm Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: npm security audit
        run: npm audit --audit-level=high
        continue-on-error: true   # warn but don't block on moderate issues
