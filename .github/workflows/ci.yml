name: CI — Test & Lint

# ──────────────────────────────────────────────────────────────
# Runs on every push to main/develop and on all pull requests.
# Jobs:
#   1. php-tests  — PHPUnit (SQLite in-memory, fast)
#   2. php-lint   — PHP syntax check across all source files
#   3. npm-build  — Verify frontend assets compile cleanly
# ──────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master, develop, staging]
  pull_request:
    branches: [main, master, develop, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.3"
  NODE_VERSION: "20"

jobs:

  # ════════════════════════════════════════════════════════════
  #  Job 1: PHPUnit tests
  # ════════════════════════════════════════════════════════════
  php-tests:
    name: PHPUnit Tests (PHP ${{ env.PHP_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, zip, gd, pcntl, bcmath, redis
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Copy .env for testing
        run: |
          cp .env.example .env.testing
          echo "APP_KEY=" >> .env.testing

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Run PHPUnit
        run: php artisan test --env=testing --stop-on-failure
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_DRIVER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  # ════════════════════════════════════════════════════════════
  #  Job 2: PHP syntax lint (catches parse errors instantly)
  # ════════════════════════════════════════════════════════════
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Lint all PHP files
        run: find app config database routes -name "*.php" -print0 | xargs -0 -P4 php -l | grep -v "^No syntax errors" || true

      - name: Check for obvious issues (artisan list smoke test)
        run: |
          cp .env.example .env
          php artisan key:generate --quiet || true
          php artisan --version
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

  # ════════════════════════════════════════════════════════════
  #  Job 3: Frontend asset build
  # ════════════════════════════════════════════════════════════
  npm-build:
    name: Frontend Build (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci --prefer-offline

      - name: Build production assets
        run: npm run production
