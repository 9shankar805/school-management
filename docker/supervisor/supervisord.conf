[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid
user=www

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ─────────────────────────────────────────────────────────────
;  Laravel Queue Worker — default queue (database / Redis)
;  Processes 8 jobs per worker, restarts after 3600 s to free memory
; ─────────────────────────────────────────────────────────────
[program:laravel-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work %(ENV_QUEUE_CONNECTION)s --sleep=3 --tries=3 --max-time=3600 --queue=default,high,low
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
startsecs=5

; ─────────────────────────────────────────────────────────────
;  Laravel Queue Worker — notifications queue (higher priority)
; ─────────────────────────────────────────────────────────────
[program:laravel-worker-notifications]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work %(ENV_QUEUE_CONNECTION)s --sleep=3 --tries=3 --max-time=3600 --queue=notifications,default
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-notifications.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
startsecs=5

; ─────────────────────────────────────────────────────────────
;  Laravel Horizon (replaces individual workers when Redis is live)
;  Leave autostart=false while QUEUE_CONNECTION=database;
;  set to true once you switch QUEUE_CONNECTION=redis
; ─────────────────────────────────────────────────────────────
[program:laravel-horizon]
process_name=%(program_name)s
command=php /var/www/artisan horizon
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
user=www
redirect_stderr=true
stdout_logfile=/var/log/supervisor/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
startsecs=5

; ─────────────────────────────────────────────────────────────
;  Laravel Scheduler (runs artisan schedule:run every minute)
; ─────────────────────────────────────────────────────────────
[program:laravel-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while true; do php /var/www/artisan schedule:run >> /var/log/supervisor/scheduler.log 2>&1; sleep 60; done"
autostart=true
autorestart=true
user=www
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
